name: Deploy

# Pushes to main go live on Cloudflare Pages; pull requests from this repo get a preview URL.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Account · Cloudflare Pages · Edit) and
# CLOUDFLARE_ACCOUNT_ID. Without them the deploy step is skipped with a warning.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PROJECT: lcbcfoo-dev

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check the site
        run: python3 scripts/check-site.py

  deploy:
    needs: check
    # Fork PRs can't read the secrets, so they stop at the check.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Build dist/
        # Only the site itself (mockups/, scripts/ and the agent docs stay in the repo), with asset links
        # versioned by content so browsers never pair new HTML with a cached old stylesheet.
        run: python3 scripts/build-dist.py

      - name: Deploy to Cloudflare Pages
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping deploy."
            exit 0
          fi
          if ! npx --yes wrangler@4 pages project list | grep -q "$PROJECT"; then
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main
          fi
          npx --yes wrangler@4 pages deploy dist --project-name="$PROJECT" --branch="$BRANCH" --commit-dirty=true
